---
- name: DCM - Provision Container on Kubernetes
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Set derived variables
      ansible.builtin.set_fact:
        _resource_name: "{{ dcm_context.resource.name }}"
        _app_name: "{{ dcm_context.application.name }}"
        _namespace: "{{ target_namespace | default('dcm-' + dcm_context.application.name) }}"
        _image: "{{ image }}"
        _replicas: "{{ replicas | default(1) | int }}"
        _cpu_request: "{{ cpu | default('100m') }}"
        _memory_request: "{{ memory | default('128Mi') }}"
        _cpu_limit: "{{ cpuLimit | default('500m') }}"
        _memory_limit: "{{ memoryLimit | default('512Mi') }}"
        _port: "{{ port | default(80) | int }}"

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ _namespace }}"
        state: present

    - name: Build deployment definition
      ansible.builtin.set_fact:
        _deployment:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ _resource_name }}"
            namespace: "{{ _namespace }}"
            labels:
              app.kubernetes.io/name: "{{ _resource_name }}"
              app.kubernetes.io/part-of: "{{ _app_name }}"
              app.kubernetes.io/managed-by: dcm
          spec:
            replicas: "{{ _replicas | int }}"
            selector:
              matchLabels:
                app.kubernetes.io/name: "{{ _resource_name }}"
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "{{ _resource_name }}"
                  app.kubernetes.io/part-of: "{{ _app_name }}"
              spec:
                containers:
                  - name: "{{ _resource_name }}"
                    image: "{{ _image }}"
                    ports:
                      - containerPort: "{{ _port | int }}"
                        protocol: TCP
                    resources:
                      requests:
                        cpu: "{{ _cpu_request }}"
                        memory: "{{ _memory_request }}"
                      limits:
                        cpu: "{{ _cpu_limit }}"
                        memory: "{{ _memory_limit }}"

    - name: Deploy container
      kubernetes.core.k8s:
        state: present
        definition: "{{ _deployment }}"

    - name: Build service definition
      ansible.builtin.set_fact:
        _service:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ _resource_name }}"
            namespace: "{{ _namespace }}"
            labels:
              app.kubernetes.io/name: "{{ _resource_name }}"
              app.kubernetes.io/managed-by: dcm
          spec:
            selector:
              app.kubernetes.io/name: "{{ _resource_name }}"
            ports:
              - port: "{{ _port | int }}"
                targetPort: "{{ _port | int }}"
                protocol: TCP

    - name: Create Service
      kubernetes.core.k8s:
        state: present
        definition: "{{ _service }}"

    - name: Wait for deployment rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ _resource_name }}"
        namespace: "{{ _namespace }}"
      register: deploy_status
      until: >-
        deploy_status.resources | length > 0 and
        (deploy_status.resources[0].status.readyReplicas | default(0) | int) >= (_replicas | int)
      retries: 30
      delay: 10

    - name: Set DCM result
      ansible.builtin.set_fact:
        result:
          values:
            host: "{{ _resource_name }}.{{ _namespace }}.svc.cluster.local"
            port: "{{ _port }}"
            internalUrl: "http://{{ _resource_name }}.{{ _namespace }}.svc.cluster.local:{{ _port }}"
            namespace: "{{ _namespace }}"
            deployment: "{{ _resource_name }}"
          secrets: {}
