---
- name: DCM - Provision Container on Kubernetes
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Set derived variables
      ansible.builtin.set_fact:
        _resource_name: "{{ dcm_context.resource.name }}"
        _app_name: "{{ dcm_context.application.name }}"
        _namespace: "{{ target_namespace | default('dcm-' + dcm_context.application.name) }}"
        _image: "{{ image }}"
        _replicas: "{{ replicas | default(1) | int }}"
        _cpu_request: "{{ cpu | default('100m') }}"
        _memory_request: "{{ memory | default('128Mi') }}"
        _cpu_limit: "{{ cpuLimit | default('500m') }}"
        _memory_limit: "{{ memoryLimit | default('512Mi') }}"
        _port: "{{ port | default(80) | int }}"

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ _namespace }}"
        state: present

    - name: Deploy container
      kubernetes.core.k8s:
        state: present
        template: "{{ playbook_dir }}/templates/deployment.yml.j2"

    - name: Create Service
      kubernetes.core.k8s:
        state: present
        template: "{{ playbook_dir }}/templates/service.yml.j2"

    - name: Wait for deployment rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: "{{ _resource_name }}"
        namespace: "{{ _namespace }}"
      register: deploy_status
      until: >-
        deploy_status.resources | length > 0 and
        (deploy_status.resources[0].status.readyReplicas | default(0) | int) >= (_replicas | int)
      retries: 12
      delay: 5

    - name: Set DCM result
      ansible.builtin.set_fact:
        result:
          values:
            host: "{{ _resource_name }}.{{ _namespace }}.svc.cluster.local"
            port: "{{ _port }}"
            internalUrl: "http://{{ _resource_name }}.{{ _namespace }}.svc.cluster.local:{{ _port }}"
            namespace: "{{ _namespace }}"
            deployment: "{{ _resource_name }}"
          secrets: {}
